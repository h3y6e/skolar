<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" role="img" aria-labelledby="t d">
  <title id="t">skolar と vercel-labs/skills・gh skill の互換性</title>
  <desc id="d">10 件合格 · gh skill に 2 件の制約 (skolar 85eb01b · skills 1.7.1 · gh skill 2.102.0)。
skills、検出 (合格): vercel がスキルをインストールした状態で、skolar は最新と報告して update は何も変更しない
gh skill、検出 (合格): gh がスキルをインストールした状態で、skolar は最新と報告して update は何も変更しない
skills、skillPath なしの検出 (合格): ロックエントリに skillPath がなくても、skolar は vercel がインストールした全スキルを見つける
skills、移動の追跡 (合格): skillPath が上流になくなったとき、skolar は移動を報告して update は vercel が書くロックエントリに戻す
gh skill、移動の追跡 (合格): github-path が上流になくなったとき、skolar は移動を報告して update は gh がインストールするファイルに戻す
skills、インストール (合格): ロックファイルのあるプロジェクトに vercel と同じスキルを skolar がインストールすると、ファイルとロックエントリが一致して vercel update は何も変更しない
gh skill、インストール (合格): ロックファイルなしで skolar がインストールすると、ファイルは gh のインストールと一致して gh update は何も変更しない
gh skill、更新 (合格): 固定なしのインストールが最新リリースより古いとき、skolar update は gh update と同じファイルになる
gh skill、引き渡し (合格): skolar が gh のインストールを更新し上流が変わらないとき、gh update は何も変更しない
gh skill、再インストール (合格): skolar が更新したスキルを gh が再インストールすると、ファイルは新規の gh インストールと一致する
gh skill、検出不能なパス (制約): skolar が root-skill を gh 形式で記録すると、メタデータは実際のパスを保持して gh が . を検出できるようになるまで gh update は古いインストールに触れない
gh skill、検出不能なパス (制約): skolar が theta を gh 形式で記録すると、メタデータは実際のパスを保持して gh が extras/theta を検出できるようになるまで gh update は古いインストールに触れない
</desc>
  <style>
    text { white-space: pre; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; font-size: 13px; fill: #57575a; }
    .mono, .corner { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo; }
    .mono { font-size: 11.5px; }
    .corner { font-size: 10.5px; letter-spacing: .05em; fill: #8c8c90; }
    .muted { fill: #8c8c90; }
    .h { font-size: 14px; font-weight: 600; fill: #18181a; }
    .card { fill: #fbfbfa; stroke: #8a8a8f; stroke-width: .6; }
    .band { fill: #ededea; }
    .rule { stroke: #d4d4d6; stroke-width: .6; }
    @media (prefers-color-scheme: dark) {
      text { fill: #a3a3a3; }
      .corner, .muted { fill: #6e6e6e; }
      .h { fill: #e6e6e6; }
      .card { fill: #131313; stroke: #6a6a6a; }
      .band { fill: #262626; }
      .rule { stroke: #3e3e3e; }
    }
    .glyph { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .pass { fill: #0ca30c; }
    .gap { fill: #fab219; }
    .gap + .glyph { fill: #18181a; }
    .fail { fill: #d03b3b; }
    .none { fill: none; stroke: #b4b4b8; stroke-width: .6; }
    .none + .glyph { fill: #8c8c90; font-weight: 400; }
    @media (prefers-color-scheme: dark) {
      .rule { stroke: #222222; }
      .none { stroke: #3e3e3e; }
      .none + .glyph { fill: #6e6e6e; }
    }
  </style>
  <rect class="card" x=".5" y=".5" width="899" height="383"/>
  <text class="corner" x="34" y="44">skolar 85eb01b · skills 1.7.1 · gh skill 2.102.0</text>
