  <g><title>gh skill、引き渡し: 合格</title><rect class="pass" x="752" y="236" width="16" height="16" rx="4"/><text class="glyph" x="760" y="248" text-anchor="middle">✓</text></g>
  <line class="rule" x1="34" x2="866" y1="260" y2="260"/>
  <text x="34" y="280">再インストール</text>
  <g><title>skills、再インストール: 対象外</title><rect class="none" x="592" y="268" width="16" height="16" rx="4"/><text class="glyph" x="600" y="280" text-anchor="middle">–</text></g>
  <g><title>gh skill、再インストール: 合格</title><rect class="pass" x="752" y="268" width="16" height="16" rx="4"/><text class="glyph" x="760" y="280" text-anchor="middle">✓</text></g>
  <line class="rule" x1="34" x2="866" y1="292" y2="292"/>
  <text x="34" y="312">検出不能なパス</text>
  <g><title>skills、検出不能なパス: 対象外</title><rect class="none" x="592" y="300" width="16" height="16" rx="4"/><text class="glyph" x="600" y="312" text-anchor="middle">–</text></g>
  <g><title>gh skill、検出不能なパス: 制約</title><rect class="gap" x="752" y="300" width="16" height="16" rx="4"/><text class="glyph" x="760" y="312" text-anchor="middle">!</text></g>
